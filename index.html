<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Frases 4K</title>

  <!-- Fuente -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    .contenedor {
      width: 3840px;
      height: 2160px;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
    }

    /* 🎥 VIDEO */
    video {
      position: absolute;
      width: 3840px;
      height: 2160px;
      object-fit: cover;
      z-index: 0;
    }

    /* 🎯 CONTENEDOR CON COORDENADAS */
    .frase-contenedor {
      position: absolute;
      top: 900px;    /* 🔧 AJUSTA */
      left: 1750px;   /* 🔧 AJUSTA */
      width: 1900px; /* 🔧 AJUSTA */
      height: 400px; /* 🔧 AJUSTA */
      z-index: 1;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #frase {
      font-family: "Dela Gothic One", sans-serif;
      font-size: 180px;
      color: white;
      text-align: center;
      letter-spacing: 4px;
      line-height: 1.1;
    }
  </style>
</head>

<body>
  <div class="contenedor" id="contenedor">

    <video autoplay muted loop playsinline>
      <source src="fondo.mp4" type="video/mp4">
    </video>

    <div class="frase-contenedor">
      <div id="frase">Cargando...</div>
    </div>

  </div>

  <script>
    const frases = [
"Usted no se manda solo.",
"Mientras viva bajo este techo, se hace lo que yo diga",
"No me abra los ojos que no le voy a echar gotas",
"Si sus amigos se tiran de un puente, ¿usted también?",
"Le entra por un oído y le sale por el otro",
"Cuento hasta 3...",
"¡Búsqueme que me va a encontrar!",
"Algún día me lo va a agradecer.",
"Cuando tengas hijos, te vas a acordar de mí."
];

    const elemento = document.getElementById("frase");

    function cambiarFrase() {
      const randomIndex = Math.floor(Math.random() * frases.length);
      elemento.textContent = frases[randomIndex];
    }

    cambiarFrase();
    setInterval(cambiarFrase, 5000);

    function escalar() {
      const escalaX = window.innerWidth / 3840;
      const escalaY = window.innerHeight / 2160;
      const escala = Math.min(escalaX, escalaY);

      document.getElementById("contenedor").style.transform = `scale(${escala})`;
    }

    window.addEventListener("resize", escalar);
    escalar();
  </script>
</body>
</html>
